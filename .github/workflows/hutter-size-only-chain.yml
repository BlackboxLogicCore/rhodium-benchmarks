name: Hutter 32-Way Burst Size-Only

on:
  push:
    paths:
      - ".github/workflows/hutter-size-only-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 83f2603f3f7751da5f429fd32669807eb8510494

jobs:
  burst:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Launch all 32 candidates at once
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl make curl gnupg lsb-release software-properties-common

          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 >/dev/null
          rm llvm.sh

          git clone --filter=blob:none https://github.com/astOwOlfo/fx2-cmix-transformer-v1.git base
          cd base
          git checkout "$UPSTREAM_COMMIT"
          cd ..

          mkdir -p work tmp results

          run_one() {
            seed="$1"
            limit="$2"
            id="${seed}-${limit}"
            dir="$GITHUB_WORKSPACE/work/$id"
            tmp="$GITHUB_WORKSPACE/tmp/$id"

            cp -a "$GITHUB_WORKSPACE/base" "$dir"
            mkdir -p "$tmp"

            (
              set -euo pipefail
              cd "$dir"

              sed -i "s/^SEED=\"923\"$/SEED=\"${seed}\"/" build_and_construct_comp.sh
              sed -i "s/^UPDATE_LIMIT=\"3000\"$/UPDATE_LIMIT=\"${limit}\"/" build_and_construct_comp.sh

              ./build_and_construct_comp.sh >"$tmp/build.log" 2>&1

              cp run/cmix_orig run/cmix_size_prefix
              upx-ucl -d run/cmix_size_prefix >/dev/null 2>&1

              STRIP_BIN="$(command -v llvm-strip-17 || command -v llvm-strip || command -v strip)"
              "$STRIP_BIN" --strip-all run/cmix_size_prefix
              upx-ucl --best --lzma run/cmix_size_prefix >/dev/null 2>&1

              cat                 run/cmix_size_prefix                 run/comp_dict                 run/comp_order                 run/comp_tfweights                 run/header.dat                 > run/cmix_size_candidate
              chmod +x run/cmix_size_candidate

              cp prof_input/input "$tmp/input"

              ./run/cmix_size_candidate -c "$tmp/input" "$tmp/archive" >"$tmp/compress.log" 2>&1
              ./run/cmix_size_candidate -d "$tmp/archive" "$tmp/restored" >"$tmp/decompress.log" 2>&1

              SRC_HASH="$(sha256sum "$tmp/input" | awk '{print $1}')"
              DST_HASH="$(sha256sum "$tmp/restored" | awk '{print $1}')"
              test "$SRC_HASH" = "$DST_HASH"

              COMP_BYTES="$(stat -c%s run/cmix_size_candidate)"
              ARCHIVE_BYTES="$(stat -c%s "$tmp/archive")"
              TOTAL_BYTES="$((COMP_BYTES + ARCHIVE_BYTES))"

              python3 - <<PY
          import json
          row = {
            "seed": int("$seed"),
            "update_limit": int("$limit"),
            "compressor_bytes": int("$COMP_BYTES"),
            "archive_bytes": int("$ARCHIVE_BYTES"),
            "net_total_bytes": int("$TOTAL_BYTES"),
            "roundtrip": "PASS"
          }
          open("$GITHUB_WORKSPACE/results/$id.json","w").write(
              json.dumps(row, sort_keys=True) + "\\n"
          )
          PY
            )
          }

          pids=()
          for seed in 1009 1019 1021 1031 1033 1039 1049 1061; do
            for limit in 4000 4200 4600 5200; do
              (run_one "$seed" "$limit" || echo "FAILED=${seed}-${limit}") &
              pids+=("$!")
            done
          done

          for pid in "${pids[@]}"; do
            wait "$pid" || true
          done

          python3 - <<'PY'
          import glob, json, os

          rows = []
          for path in glob.glob("results/*.json"):
              try:
                  row = json.load(open(path))
                  if row.get("roundtrip") == "PASS":
                      rows.append(row)
              except Exception:
                  pass

          if not rows:
              raise SystemExit("NO_VALID_CANDIDATES")

          rows.sort(key=lambda x: (
              x["net_total_bytes"],
              x["archive_bytes"],
              x["compressor_bytes"]
          ))

          result = {
              "verified_candidates": len(rows),
              "best": rows[0],
              "selection_metric": "NET_TOTAL_BYTES_ONLY",
              "runtime_used_for_selection": False
          }

          open("hutter-32-burst-result.json","w").write(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )

          print(json.dumps(result, indent=2, sort_keys=True))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              b = rows[0]
              f.write("## Hutter 32-way burst\n\n")
              f.write(f"Verified: {len(rows)}/32\n\n")
              f.write(f"Best seed={b['seed']} limit={b['update_limit']}\n\n")
              f.write(f"Archive={b['archive_bytes']} bytes\n\n")
              f.write(f"Compressor={b['compressor_bytes']} bytes\n\n")
              f.write(f"Net total={b['net_total_bytes']} bytes\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hutter-32-burst-result
          path: hutter-32-burst-result.json
          retention-days: 7
