name: Rhodium Hutter enwik9 Strict Cold

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rhodium-hutter-enwik9-strict.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-enwik9:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official enwik9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 -o enwik9.zip https://mattmahoney.net/dc/enwik9.zip
          unzip -q enwik9.zip
          test -f enwik9
          BYTES=$(stat -c%s enwik9)
          SHA1=$(sha1sum enwik9 | awk '{print $1}')
          MD5=$(md5sum enwik9 | awk '{print $1}')
          echo "ENWIK9_BYTES=$BYTES"
          echo "ENWIK9_SHA1=$SHA1"
          echo "ENWIK9_MD5=$MD5"
          test "$BYTES" -eq 1000000000
          test "$SHA1" = "2996e86fb978f93cca8f566cc56998923e7fe581"
          test "$MD5" = "e206c3450ac99950df65bf70ef61a12d"

      - name: Run exact Rhodium Ubuntu script unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-delete-bin"
          cat > "$RUNNER_TEMP/no-delete-bin/rm" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/no-delete-bin/rm"
          export PATH="$RUNNER_TEMP/no-delete-bin:$PATH"
          bash ./scripts/rhodium-zero-payload-ultimo.sh

      - name: Strict Hutter reconstruction verification
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=enwik9
          RESTORED=/tmp/rhodium_500k_box/reconstructed_target.bin
          SCRIPT=./scripts/rhodium-zero-payload-ultimo.sh

          SOURCE_BYTES=$(stat -c%s "$SOURCE")
          SOURCE_SHA1=$(sha1sum "$SOURCE" | awk '{print $1}')
          SCRIPT_BYTES=$(stat -c%s "$SCRIPT")

          if [ -f "$RESTORED" ]; then
            RESTORED_BYTES=$(stat -c%s "$RESTORED")
            RESTORED_SHA1=$(sha1sum "$RESTORED" | awk '{print $1}')
          else
            RESTORED_BYTES=-1
            RESTORED_SHA1=MISSING
          fi

          PAYLOAD_BYTES=0
          TOTAL_SIZE=$((SCRIPT_BYTES + PAYLOAD_BYTES))

          echo "SOURCE_BYTES=$SOURCE_BYTES"
          echo "SOURCE_SHA1=$SOURCE_SHA1"
          echo "RESTORED_BYTES=$RESTORED_BYTES"
          echo "RESTORED_SHA1=$RESTORED_SHA1"
          echo "SCRIPT_BYTES=$SCRIPT_BYTES"
          echo "PAYLOAD_BYTES=$PAYLOAD_BYTES"
          echo "S1_PLUS_S2=$TOTAL_SIZE"

          if [ "$RESTORED_BYTES" -ne 1000000000 ]; then
            echo "STRICT_HUTTER_STATUS=FAIL_RESTORED_SIZE"
            exit 1
          fi

          if [ "$RESTORED_SHA1" != "$SOURCE_SHA1" ]; then
            echo "STRICT_HUTTER_STATUS=FAIL_RESTORED_HASH"
            exit 1
          fi

          echo "STRICT_HUTTER_STATUS=PASS"
