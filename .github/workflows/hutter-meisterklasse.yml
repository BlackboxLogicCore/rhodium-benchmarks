name: Hutter Meisterklasse Fast-Final

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hutter-meisterklasse.yml"

concurrency:
  group: hutter-meisterklasse-fast-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 83f2603f3f7751da5f429fd32669807eb8510494
  ELITE_SEED: "1031"
  ELITE_LIMIT: "4000"
  ENWIK9_SHA1: 2996e86fb978f93cca8f566cc56998923e7fe581

jobs:
  screen:
    name: fast-mask-${{ matrix.mask }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        mask: [0,1,2,4,8,16,32,64,3,5,9,17,33,65,6,10,18,34,66,12,20,36,68,24,40,72,48,80,96,31,63,127]

    steps:
      - name: Fast build and roundtrip screen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl make curl gnupg lsb-release software-properties-common time
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 >/dev/null
          rm llvm.sh

          git clone --filter=blob:none https://github.com/astOwOlfo/fx2-cmix-transformer-v1.git fx2
          cd fx2
          git checkout "$UPSTREAM_COMMIT"

          sed -i "s/^SEED=\"923\"$/SEED=\"$ELITE_SEED\"/" build_and_construct_comp.sh
          sed -i "s/^UPDATE_LIMIT=\"3000\"$/UPDATE_LIMIT=\"$ELITE_LIMIT\"/" build_and_construct_comp.sh

          MASK="${{ matrix.mask }}" python3 - <<'PY'
          import os
          from pathlib import Path
          mask=int(os.environ["MASK"])
          tags=["reg","sup2","sup3","euro","isin","rarr","minus"]
          p=Path("src/readalike_prepr/phda9_preprocess.h")
          lines=p.read_text().splitlines(True)
          changed={t:0 for t in tags}
          out=[]
          for line in lines:
              new=line
              for bit,tag in enumerate(tags):
                  if mask & (1<<bit) and f"//'{tag}'" in line and line.lstrip().startswith("//if"):
                      indent=line[:len(line)-len(line.lstrip())]
                      new=indent+line.lstrip()[2:]
                      changed[tag]+=1
                      break
              out.append(new)
          for bit,tag in enumerate(tags):
              if mask & (1<<bit) and changed[tag] != 2:
                  raise SystemExit(f"PAIR_PATCH_FAIL:{tag}:{changed[tag]}")
          p.write_text("".join(out))
          print("MASK",mask)
          PY

          if ! ./build_and_construct_comp.sh >/tmp/build.log 2>&1; then
            tail -80 /tmp/build.log
            exit 2
          fi

          cp run/cmix_orig run/cmix_fast
          upx-ucl -d run/cmix_fast >/dev/null 2>&1
          STRIP_BIN="$(command -v llvm-strip-17 || command -v llvm-strip || command -v strip)"
          "$STRIP_BIN" --strip-all run/cmix_fast
          upx-ucl --best --lzma run/cmix_fast >/dev/null 2>&1
          cat run/cmix_fast run/comp_dict run/comp_order run/comp_tfweights run/header.dat > run/cmix_candidate
          chmod +x run/cmix_candidate

          mkdir -p /tmp/s
          cp prof_input/input /tmp/s/input
          /usr/bin/time -f "%e" -o /tmp/s/cs ./run/cmix_candidate -c /tmp/s/input /tmp/s/archive >/tmp/s/c.log 2>&1
          /usr/bin/time -f "%e" -o /tmp/s/ds ./run/cmix_candidate -d /tmp/s/archive /tmp/s/restored >/tmp/s/d.log 2>&1
          test "$(sha256sum /tmp/s/input | awk '{print $1}')" = "$(sha256sum /tmp/s/restored | awk '{print $1}')"

          COMP="$(stat -c%s run/cmix_candidate)"
          ARC="$(stat -c%s /tmp/s/archive)"
          TOT="$((COMP+ARC))"
          CS="$(cat /tmp/s/cs)"
          DS="$(cat /tmp/s/ds)"

          python3 - <<PY
          import json
          r={
            "mask": ${{ matrix.mask }},
            "compressor_bytes": int("$COMP"),
            "sample_archive_bytes": int("$ARC"),
            "sample_total_bytes": int("$TOT"),
            "compress_seconds": float("$CS"),
            "decompress_seconds": float("$DS"),
            "roundtrip":"PASS"
          }
          open("screen.json","w").write(json.dumps(r,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fast-mask-${{ matrix.mask }}
          path: fx2/screen.json
          retention-days: 7

  shortlist:
    name: Pick five smallest
    needs: screen
    if: always()
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-mask-*
          path: results
          merge-multiple: false

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob,json
          rows=[]
          for p in glob.glob("results/**/screen.json",recursive=True):
              try:
                  x=json.load(open(p))
                  if x.get("roundtrip")=="PASS": rows.append(x)
              except Exception:
                  pass
          if not rows:
              raise SystemExit("NO_FAST_SCREEN_PASS")
          rows.sort(key=lambda x:(x["sample_total_bytes"],x["compress_seconds"]+x["decompress_seconds"],x["mask"]))
          base=next((x for x in rows if x["mask"]==0),None)
          if base is None:
              raise SystemExit("P0_BASELINE_MASK0_MISSING")
          eligible=[x for x in rows if x["sample_total_bytes"] <= base["sample_total_bytes"]]
          eligible.sort(key=lambda x:(x["sample_total_bytes"],x["compress_seconds"]+x["decompress_seconds"],x["mask"]))
          picked=eligible[:5]
          if not any(x["mask"]==0 for x in picked):
              picked=picked[:4]+[base]
          print("matrix="+json.dumps({"include":[{"mask":x["mask"]} for x in picked]},separators=(",",":")))
          open("shortlist.json","w").write(json.dumps({
              "verified":len(rows),
              "p0_baseline":base,
              "p0_eligible":len(eligible),
              "picked":picked
          },indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: meister-fast-shortlist
          path: shortlist.json
          retention-days: 7

  full_proxy:
    name: full-enwik9-proxy-${{ matrix.mask }}
    needs: shortlist
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.shortlist.outputs.matrix) }}

    steps:
      - name: Full enwik9 size proxy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl make curl unzip gnupg lsb-release software-properties-common time
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 >/dev/null
          rm llvm.sh

          git clone --filter=blob:none https://github.com/astOwOlfo/fx2-cmix-transformer-v1.git fx2
          cd fx2
          git checkout "$UPSTREAM_COMMIT"
          sed -i "s/^SEED=\"923\"$/SEED=\"$ELITE_SEED\"/" build_and_construct_comp.sh
          sed -i "s/^UPDATE_LIMIT=\"3000\"$/UPDATE_LIMIT=\"$ELITE_LIMIT\"/" build_and_construct_comp.sh

          MASK="${{ matrix.mask }}" python3 - <<'PY'
          import os
          from pathlib import Path
          mask=int(os.environ["MASK"])
          tags=["reg","sup2","sup3","euro","isin","rarr","minus"]
          p=Path("src/readalike_prepr/phda9_preprocess.h")
          lines=p.read_text().splitlines(True)
          out=[]; changed={t:0 for t in tags}
          for line in lines:
              new=line
              for bit,tag in enumerate(tags):
                  if mask & (1<<bit) and f"//'{tag}'" in line and line.lstrip().startswith("//if"):
                      indent=line[:len(line)-len(line.lstrip())]
                      new=indent+line.lstrip()[2:]
                      changed[tag]+=1
                      break
              out.append(new)
          for bit,tag in enumerate(tags):
              if mask & (1<<bit) and changed[tag]!=2:
                  raise SystemExit(f"PAIR_PATCH_FAIL:{tag}:{changed[tag]}")
          p.write_text("".join(out))
          PY

          if ! ./build_and_construct_comp.sh >/tmp/build.log 2>&1; then
            tail -80 /tmp/build.log
            exit 2
          fi

          cp run/cmix_orig run/cmix_fast
          upx-ucl -d run/cmix_fast >/dev/null 2>&1
          STRIP_BIN="$(command -v llvm-strip-17 || command -v llvm-strip || command -v strip)"
          "$STRIP_BIN" --strip-all run/cmix_fast
          upx-ucl --best --lzma run/cmix_fast >/dev/null 2>&1
          cat run/cmix_fast run/comp_dict run/comp_order run/comp_tfweights run/header.dat > run/cmix_candidate
          chmod +x run/cmix_candidate

          wget -q https://mattmahoney.net/dc/enwik9.zip -O /tmp/enwik9.zip
          unzip -q /tmp/enwik9.zip -d /tmp/enwik9-dir
          test "$(stat -c%s /tmp/enwik9-dir/enwik9)" = "1000000000"
          test "$(sha1sum /tmp/enwik9-dir/enwik9 | awk '{print $1}')" = "$ENWIK9_SHA1"

          /usr/bin/time -f "%e" -o /tmp/proxy.seconds ./run/cmix_candidate -e /tmp/enwik9-dir/enwik9 /tmp/enwik9.ppmd --ppmd-only >/tmp/proxy.log 2>&1
          COMP="$(stat -c%s run/cmix_candidate)"
          PPMD="$(stat -c%s /tmp/enwik9.ppmd)"
          TOT="$((COMP+PPMD))"
          SEC="$(cat /tmp/proxy.seconds)"

          python3 - <<PY
          import json
          r={
            "mask": ${{ matrix.mask }},
            "compressor_bytes": int("$COMP"),
            "ppmd_bytes": int("$PPMD"),
            "proxy_total_bytes": int("$TOT"),
            "proxy_seconds": float("$SEC"),
            "input":"official enwik9",
            "official_score":False
          }
          open("proxy.json","w").write(json.dumps(r,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: full-proxy-${{ matrix.mask }}
          path: fx2/proxy.json
          retention-days: 7

  choose_final:
    needs: full_proxy
    if: always()
    runs-on: ubuntu-22.04
    outputs:
      mask: ${{ steps.pick.outputs.mask }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: full-proxy-*
          path: results
          merge-multiple: false

      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob,json
          rows=[]
          for p in glob.glob("results/**/proxy.json",recursive=True):
              try: rows.append(json.load(open(p)))
              except Exception: pass
          if not rows: raise SystemExit("NO_FULL_PROXY_PASS")
          base=next((x for x in rows if x["mask"]==0),None)
          if base is None:
              raise SystemExit("P0_FULL_BASELINE_MASK0_MISSING")
          eligible=[x for x in rows if x["proxy_total_bytes"] <= base["proxy_total_bytes"]]
          if not eligible:
              raise SystemExit("P0_NO_NONWORSE_FULL_PROXY")
          eligible.sort(key=lambda x:(x["proxy_total_bytes"],x["proxy_seconds"],x["mask"]))
          best=eligible[0]
          print("mask="+str(best["mask"]))
          open("proxy-winner.json","w").write(json.dumps({
              "best":best,
              "verified":len(rows),
              "p0_baseline":base,
              "p0_eligible":len(eligible)
          },indent=2)+"\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: meister-proxy-winner
          path: proxy-winner.json
          retention-days: 7

  exact_final:
    name: exact-official-enwik9
    needs: choose_final
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Build exact winner and verify archive9
        shell: bash
        env:
          WINNER_MASK: ${{ needs.choose_final.outputs.mask }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl make curl unzip gnupg lsb-release software-properties-common time
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17 >/dev/null
          rm llvm.sh

          git clone --filter=blob:none https://github.com/astOwOlfo/fx2-cmix-transformer-v1.git fx2
          cd fx2
          git checkout "$UPSTREAM_COMMIT"
          sed -i "s/^SEED=\"923\"$/SEED=\"$ELITE_SEED\"/" build_and_construct_comp.sh
          sed -i "s/^UPDATE_LIMIT=\"3000\"$/UPDATE_LIMIT=\"$ELITE_LIMIT\"/" build_and_construct_comp.sh

          MASK="$WINNER_MASK" python3 - <<'PY'
          import os
          from pathlib import Path
          mask=int(os.environ["MASK"])
          tags=["reg","sup2","sup3","euro","isin","rarr","minus"]
          p=Path("src/readalike_prepr/phda9_preprocess.h")
          lines=p.read_text().splitlines(True)
          out=[]; changed={t:0 for t in tags}
          for line in lines:
              new=line
              for bit,tag in enumerate(tags):
                  if mask & (1<<bit) and f"//'{tag}'" in line and line.lstrip().startswith("//if"):
                      indent=line[:len(line)-len(line.lstrip())]
                      new=indent+line.lstrip()[2:]
                      changed[tag]+=1
                      break
              out.append(new)
          for bit,tag in enumerate(tags):
              if mask & (1<<bit) and changed[tag]!=2:
                  raise SystemExit(f"PAIR_PATCH_FAIL:{tag}:{changed[tag]}")
          p.write_text("".join(out))
          PY

          ./build_and_construct_comp.sh >/tmp/build.log 2>&1
          cp run/cmix_orig run/cmix_fast
          upx-ucl -d run/cmix_fast >/dev/null 2>&1
          STRIP_BIN="$(command -v llvm-strip-17 || command -v llvm-strip || command -v strip)"
          "$STRIP_BIN" --strip-all run/cmix_fast
          upx-ucl --best --lzma run/cmix_fast >/dev/null 2>&1
          cat run/cmix_fast run/comp_dict run/comp_order run/comp_tfweights run/header.dat > run/cmix_candidate
          chmod +x run/cmix_candidate

          wget -q https://mattmahoney.net/dc/enwik9.zip -O /tmp/enwik9.zip
          mkdir -p /tmp/source /tmp/exact /tmp/restore
          unzip -q /tmp/enwik9.zip -d /tmp/source
          test "$(stat -c%s /tmp/source/enwik9)" = "1000000000"
          test "$(sha1sum /tmp/source/enwik9 | awk '{print $1}')" = "$ENWIK9_SHA1"

          cp run/cmix_candidate /tmp/exact/cmix
          cp /tmp/source/enwik9 /tmp/exact/enwik9
          chmod +x /tmp/exact/cmix

          (
            cd /tmp/exact
            /usr/bin/time -f "%e" -o /tmp/exact.seconds ./cmix -e enwik9 enwik9.comp >/tmp/exact.log 2>&1
            test -f archive9
          )

          cp /tmp/exact/archive9 /tmp/restore/archive9
          chmod +x /tmp/restore/archive9
          (
            cd /tmp/restore
            /usr/bin/time -f "%e" -o /tmp/restore.seconds ./archive9 >/tmp/restore.log 2>&1
          )

          test -f /tmp/restore/enwik9_uncompressed
          test "$(sha1sum /tmp/restore/enwik9_uncompressed | awk '{print $1}')" = "$ENWIK9_SHA1"

          SCORE="$(stat -c%s /tmp/exact/archive9)"
          CSEC="$(cat /tmp/exact.seconds)"
          DSEC="$(cat /tmp/restore.seconds)"
          TARGET=99420425

          python3 - <<PY
          import json
          score=int("$SCORE")
          target=int("$TARGET")
          r={
            "mask":int("$WINNER_MASK"),
            "seed":1031,
            "update_limit":4000,
            "archive9_bytes":score,
            "compress_seconds":float("$CSEC"),
            "decompress_seconds":float("$DSEC"),
            "roundtrip":"PASS",
            "target_bytes":target,
            "target_reached":score<=target,
            "official_enwik9_sha1":"$ENWIK9_SHA1"
          }
          open("hutter-meisterklasse-final.json","w").write(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hutter-meisterklasse-final
          path: fx2/hutter-meisterklasse-final.json
          retention-days: 7
