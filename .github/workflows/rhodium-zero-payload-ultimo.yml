name: Rhodium Zero Payload Ultimo

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/rhodium-zero-payload-ultimo.sh'
      - '.github/workflows/rhodium-zero-payload-ultimo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-zero-payload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run exact Ubuntu benchmark
        shell: bash
        run: bash ./scripts/rhodium-zero-payload-ultimo.sh
