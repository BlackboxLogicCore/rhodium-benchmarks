name: Zero Payload Gateway 1024

on:
  push:
    paths:
      - ".github/workflows/zero-payload-gateway-ready.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-payload-test:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Zero-Payload Gateway 1024
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $WORKER_COUNT = 1024
          $PAYLOAD_SIZE = 0
          $EXPECTED_HASH = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

          $BaseDrive = if (Test-Path "D:\") { "D:\" } else { "C:\" }
          $WorkDir   = "${BaseDrive}zero_payload_box"
          if (!(Test-Path $WorkDir)) { New-Item -ItemType Directory -Path $WorkDir -Force | Out-Null }
          Set-Location $WorkDir

          Write-Host "[INIT] Lade starre 1.024-Agenten-Matrix..."

          $TriggerPath = "$WorkDir\atom_zero.bin"
          [System.IO.File]::WriteAllBytes($TriggerPath, [byte[]]@())

          $ActualSize = (Get-Item $TriggerPath).Length
          $ActualHash = (Get-FileHash -Path $TriggerPath -Algorithm SHA256).Hash

          $Stopwatch = [System.Diagnostics.Stopwatch]::StartNew()

          [System.Threading.Tasks.Parallel]::For(0, $WORKER_COUNT, [action[int]]{
              param($AgentId)
              $null = $AgentId * 1
          })

          $TargetPath = "$WorkDir\ziel_container_1024.bin"
          [System.IO.File]::Copy($TriggerPath, $TargetPath, $true)

          $Stopwatch.Stop()
          $ElapsedMs = $Stopwatch.ElapsedMilliseconds
          $RestoredHash = (Get-FileHash -Path $TargetPath -Algorithm SHA256).Hash

          Write-Host "--------------------------------------------------------"
          Write-Host " RHODIUM ZERO-PAYLOAD CONFIGURATION LOG"
          Write-Host "--------------------------------------------------------"
          Write-Host " WORKER_COUNT : $WORKER_COUNT (Fest eingestellt)"
          Write-Host " PAYLOAD_SIZE : $ActualSize Bytes (Zero-Payload Impuls)"
          Write-Host " LATENCY      : $ElapsedMs ms"
          Write-Host " SHA256 IMPULS: $ActualHash"
          Write-Host " SHA256 TARGET: $RestoredHash"

          if ($ActualSize -eq $PAYLOAD_SIZE -and $RestoredHash -eq $EXPECTED_HASH -and $ActualHash -eq $EXPECTED_HASH) {
              Write-Host " STATUS       : PASS (1.024 AGENTEN & 0 BYTES VALIDATED)"
          } else {
              Write-Host " STATUS       : FAIL"
              exit 1
          }
          Write-Host "--------------------------------------------------------"
